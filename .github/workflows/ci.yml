  healthcheck-windows:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      UCM_RUNS_ROOT: ${{ runner.temp }}\UCM_RUNS

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Python info
        shell: pwsh
        run: |
          python -V
          python -m pip --version

      - name: Install deps for engines
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install numpy scipy matplotlib

      - name: Healthcheck (fast)
        shell: pwsh
        run: |
          python -m tools.calib healthcheck --fast --phase0-c0 2.111 --phase0-rho-inf 0.123 --phase0-kappa 0.00456 --phase0-kappa-s 0.0789

      - name: Upload runs artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calib-runs-windows
          path: ${{ runner.temp }}\UCM_RUNS
