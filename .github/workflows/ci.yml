
name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile all python files
        run: python -m compileall -q .

  healthcheck-windows:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      UCM_RUNS_ROOT: "${{ runner.temp }}\\UCM_RUNS"

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Python info
        shell: pwsh
        run: |
          python -V
          python -m pip --version

      - name: Install deps for engines
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install numpy scipy matplotlib

      - name: Healthcheck (fast)
        shell: pwsh
        run: |
          python -m tools.calib healthcheck --fast --phase0-c0 2.111 --phase0-rho-inf 0.123 --phase0-kappa 0.00456 --phase0-kappa-s 0.0789

      - name: Debug dump (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== DEBUG: list runs root ==="
          if (Test-Path $env:UCM_RUNS_ROOT) { Get-ChildItem $env:UCM_RUNS_ROOT -Recurse -Force | Select-Object FullName | Format-Table -HideTableHeaders }

          Write-Host "=== DEBUG: wrapper_status.json ==="
          if (Test-Path $env:UCM_RUNS_ROOT) {
            Get-ChildItem $env:UCM_RUNS_ROOT -Recurse -Filter wrapper_status.json -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host ("--- " + $_.FullName)
              Get-Content $_.FullName -Raw
            }
          }

          Write-Host "=== DEBUG: results_global.json (tail fields) ==="
          if (Test-Path $env:UCM_RUNS_ROOT) {
            Get-ChildItem $env:UCM_RUNS_ROOT -Recurse -Filter results_global.json -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host ("--- " + $_.FullName)
              $j = Get-Content $_.FullName -Raw | ConvertFrom-Json
              $o = [ordered]@{
                module = $j.module
                status = $j.status
                error  = $j.error
                engine_returncode = $j.engine_returncode
                stdout_tail = $j.stdout_tail
                stderr_tail = $j.stderr_tail
              }
              $o | Format-List
            }
          }

      - name: Upload runs artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calib-runs-windows
          path: ${{ env.UCM_RUNS_ROOT }}
